[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "approval-ops-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.156.7,<1", "uvicorn>=0.38,<1", "httpx>=0.28,<1", "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4"]
[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "ruff>=0.9,<1", "mypy>=1.14,<2", "pip-audit>=2,<3"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
[tool.pytest.ini_options]
testpaths = ["tests"]
